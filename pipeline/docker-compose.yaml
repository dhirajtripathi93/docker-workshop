version: '3.8'

services:
  pgdatabase:
    image: postgres:18
    container_name: pgdatabase
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: ny_taxi
    ports:
      - "5432:5432"
    volumes:
      - ny_taxi_postgres_data:/var/lib/postgresql
    networks:
      - pg-network
    stdin_open: true
    tty: true

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "8085:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - pg-network
    stdin_open: true
    tty: true

  taxi_ingest:
    image: taxi_ingest:v001
    container_name: taxi_ingest
    network_mode: "host"
    command:
      - --pg-user=root
      - --pg-pass=root
      - --pg-host=localhost
      - --pg-port=5432
      - --pg-db=ny_taxi
      - --target-table=yellow_taxi_trips
      - --year=2021
      - --month=1
    depends_on:
      - pgdatabase

volumes:
  ny_taxi_postgres_data:
  pgadmin_data:

networks:
  pg-network:
    driver: bridge